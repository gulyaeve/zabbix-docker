
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream grafana {
    server grafana:3000;
}

server {
    listen 80;
    server_name zabbix.itmoscow; # Replace with your domain or IP

    location /zabbix/ {
        proxy_pass http://zabbix-web:8080/; # Use the service name and internal port of the Zabbix web container
        # proxy_redirect off;
        
        # Required headers for correct Zabbix functionality
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for login issues if using a subdirectory path
        proxy_cookie_path / /zabbix/;
    }

    location /grafana {
    return 301 /grafana/;
    }

    location /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;

        proxy_pass http://grafana;
        # proxy_redirect off;
        
        # proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Host $host;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}
